apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: ecom-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ecom-backend

  template:
    metadata:
      labels:
        app: ecom-backend
        azure.workload.identity/use: "true"

    spec:
      serviceAccountName: backend-service-account

      containers:
        - name: backend
          image: acrecomdev00123.azurecr.io/ecom-backend:latest
          imagePullPolicy: Always

          command:
            - /bin/sh
            - -c

          args:
            - |
              export DB_HOST="$(cat /mnt/secrets-store/db-host)"
              export DB_NAME="$(cat /mnt/secrets-store/db-name)"
              export DB_USER="$(cat /mnt/secrets-store/db-username)"
              export DB_PASSWORD="$(cat /mnt/secrets-store/db-password)"
              export DB_PORT="5432"
              exec npm start

          ports:
            - containerPort: 5000

          env:
            - name: PORT
              value: "5000"

          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true

          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: backend-keyvault-secrets